
networks:
  erp-network:
    driver: bridge

# Rotação dos logs de cada container: no máximo 5 arquivos de 10 MB. Sem isto o log
# cresce sem limite (o daphne grava uma linha por conexão/desconexão o dia todo) até
# encher o disco — e disco cheio derruba o MySQL.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Teto de memória por container (mem_limit): se um processo disparar, o Docker reinicia
# só aquele container em vez de a máquina inteira travar (provável causa das quedas de
# 23/10). Valores padrão abaixo; ajuste no .env (MEM_LIMIT_*) conforme a RAM do servidor
# — ver `docker stats --no-stream`. Teto não é reserva: a soma pode passar da RAM total.

services:
  traefik:
    image: traefik:v3.7
    container_name: erp_traefik
    # Sem isto o Traefik (porta de entrada 80/443) ficava parado depois de um reinício do
    # servidor e o site seguia fora do ar com todo o resto de pé (23/10, 15:50–16:19).
    restart: always
    logging: *logging
    mem_limit: ${MEM_LIMIT_TRAEFIK:-256m}
    ports:
      - "80:80"       # Porta padrão web HTTP (Acesse http://localhost)
      - "443:443"     # Porta padrão web HTTPS (Acesse https://localhost)
      - "127.0.0.1:8080:8080"   # Painel visual do Traefik (Acesse http://localhost:8080)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/acme.json:/acme.json
    entrypoint:
      - /usr/local/bin/traefik
      - --configfile=/etc/traefik/traefik.yml
    networks:
      - erp-network

  database:
    image: mysql:8.0
    container_name: erp_database
    restart: always
    logging: *logging
    mem_limit: ${MEM_LIMIT_DATABASE:-1g}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    #ports:
    #  - "127.0.0.1:3306:3306" # Expõe o banco para inspeção apenas para acesso ssh ou direto da própria máquina
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - erp-network

  # Channel layer do tempo real (WebSocket) — ver docs/backlog/tempo-real-websockets.md.
  # Obrigatório porque backend (gunicorn, 3 workers) e ws (daphne) são processos
  # separados: sem Redis, o aviso "coleção X mudou" publicado por um worker do backend
  # nunca chegaria às conexões WebSocket abertas no processo do ws. Rede interna só —
  # nenhuma porta exposta ao host.
  redis:
    image: redis:7-alpine
    container_name: erp_redis
    restart: always
    logging: *logging
    mem_limit: ${MEM_LIMIT_REDIS:-128m}
    # Sem gravação em disco: o Redis só guarda dado descartável (quem está conectado no
    # tempo real, refeito quando os navegadores reconectam; contadores de limite de login
    # por minuto). Os bloqueios de login ficam no MySQL. Isto evita a cópia do processo a
    # cada 5 min para salvar (o risco do aviso "Memory overcommit" no log).
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - erp-network

  # --- BACKEND: DJANGO ---
  backend:
    build: ./BackEnd  # Compila usando o Dockerfile do seu backend
    container_name: erp_backend
    restart: always
    logging: *logging
    mem_limit: ${MEM_LIMIT_BACKEND:-1g}
    volumes:
      # Documentos enviados pelos usuários (MEDIA_ROOT). SEM este volume os anexos
      # ficam na camada gravável do container e somem a cada `up --build`.
      - media_data:/app/media
    #  - ./BackEnd:/app # Volume ativo APENAS para ambiente Dev (Hot Reload)
    command: sh -c "python manage.py collectstatic --noinput &&
                    python manage.py migrate && 
                    python manage.py setup_admin --if-missing &&
                    gunicorn ERP_Linave_BackEnd.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2"
    environment:
      - DB_HOST=database
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DJANGO_DEBUG=${DJANGO_DEBUG}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DJANGO_CORS_ALLOWED_ORIGINS=${DJANGO_CORS_ALLOWED_ORIGINS}
      - REDIS_URL=redis://redis:6379/0
      # Senha inicial do usuário admin (setup_admin). Sem ela, é gerada uma aleatória e
      # impressa uma vez no log (`docker logs erp_backend`).
      - DJANGO_ADMIN_PASSWORD=${DJANGO_ADMIN_PASSWORD:-}
    depends_on:
        database:
          condition: service_healthy
        redis:
          condition: service_healthy
    networks:
      - erp-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.rule=Host(`${DOMINIO_SISTEMA}`) && (PathPrefix(`/api`) || PathPrefix(`/comercial`) || PathPrefix(`/token`) || PathPrefix(`/jamanta-fiscal`))" # Encaminha tudo que for /api para o Django
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.http.routers.backend.tls.certresolver=meu-resolvedor"
    
      # Headers de segurança para o Backend
      - "traefik.http.routers.backend.middlewares=backend-secure-headers"
      - "traefik.http.middlewares.backend-secure-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.backend-secure-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.backend-secure-headers.headers.frameDeny=true"
      # HSTS: o navegador passa a só usar HTTPS neste domínio por 1 ano. Sem
      # includeSubDomains/preload de propósito (afetaria outros subdomínios da empresa).
      - "traefik.http.middlewares.backend-secure-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.backend-secure-headers.headers.contentSecurityPolicy=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"

  # --- WEBSOCKET: DAPHNE (tempo real) ---
  # Mesma imagem do backend, processo à parte rodando daphne em vez de gunicorn — HTTP
  # continua 100% no gunicorn/WSGI acima, intocado (ver docs/backlog/tempo-real-websockets.md,
  # "não trocar a stack HTTP inteira de uma vez"). Só esse processo serve /ws/workspace/.
  ws:
    build: ./BackEnd
    container_name: erp_ws
    restart: always
    logging: *logging
    mem_limit: ${MEM_LIMIT_WS:-512m}
    command: python -m daphne -b 0.0.0.0 -p 8001 ERP_Linave_BackEnd.asgi:application
    environment:
      - DB_HOST=database
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DJANGO_DEBUG=${DJANGO_DEBUG}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DJANGO_CORS_ALLOWED_ORIGINS=${DJANGO_CORS_ALLOWED_ORIGINS}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
        database:
          condition: service_healthy
        redis:
          condition: service_healthy
    networks:
      - erp-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ws.entrypoints=websecure"
      # PathPrefix(/ws) é mais específico que o Host() sozinho do router do frontend
      # abaixo — Traefik prioriza a regra mais específica, então isso vence sem precisar
      # de "priority" explícito (mesmo mecanismo que já separa /comercial do resto pro
      # backend).
      - "traefik.http.routers.ws.rule=Host(`${DOMINIO_SISTEMA}`) && PathPrefix(`/ws`)"
      - "traefik.http.services.ws.loadbalancer.server.port=8001"
      - "traefik.http.routers.ws.tls.certresolver=meu-resolvedor"

  # --- FRONTEND: REACT ---
  frontend:
    build: ./FrontEnd
    container_name: erp_frontend
    restart: always
    logging: *logging
    mem_limit: ${MEM_LIMIT_FRONTEND:-128m}
    volumes:
      # Mesmo volume do backend, somente leitura: o nginx serve /media/ direto do disco.
      - media_data:/usr/share/nginx/media:ro
    #  - ./FrontEnd:/app # Volume ativo APENAS para ambiente Dev (Hot Reload)
    depends_on:
      - backend
    networks:
      - erp-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.rule=Host(`${DOMINIO_SISTEMA}`)" # Todo o restante vai para o React
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.frontend.tls.certresolver=meu-resolvedor"
    
      # Fallback para Redirecionamento de HTTP para HTTPS
      - "traefik.http.routers.frontend-web.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    
      # Headers de segurança
      - "traefik.http.routers.frontend.middlewares=secure-headers"
      - "traefik.http.middlewares.secure-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.secure-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.secure-headers.headers.customFrameOptionsValue=SAMEORIGIN"
      # HSTS: o navegador passa a só usar HTTPS neste domínio por 1 ano. Sem
      # includeSubDomains/preload de propósito (afetaria outros subdomínios da empresa).
      - "traefik.http.middlewares.secure-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.secure-headers.headers.contentSecurityPolicy=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';"

volumes:
  mysql_data:
  media_data:   # Anexos/documentos enviados pelos usuários (MEDIA_ROOT do Django)
