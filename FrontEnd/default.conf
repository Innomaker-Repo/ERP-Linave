# /media/: só PDF e imagem podem abrir no navegador; o resto é download sem renderizar
# (ver comentário em `location /media/`). Este arquivo é incluído dentro de http{} pela
# imagem oficial do nginx (conf.d/*.conf), por isso o `map` pode ficar aqui.
map $uri $media_disposition {
    ~*\.(pdf|png|jpe?g|gif|webp|bmp)$  "";
    default                            "attachment";
}
map $uri $media_csp {
    ~*\.(pdf|png|jpe?g|gif|webp|bmp)$  "";
    default                            "default-src 'none'; sandbox";
}

server {
    listen 80;
    server_name localhost;

    # Oculta a versão do Nginx
    server_tokens off;

    # Cabeçalhos de Segurança Pesados — manter a CSP igual à do Traefik (docker-compose.yml).
    # * script-src só 'self': o build do Vite não tem script inline nem eval (o único
    #   Function("return this") das libs só roda se faltar globalThis).
    # * style-src mantém 'unsafe-inline': React/MUI aplicam estilo inline.
    # * blob:: pré-visualização de foto/anexo antes do upload (URL.createObjectURL).
    # * SAMEORIGIN/frame-ancestors 'self': o ERP mostra os próprios anexos num <iframe>
    #   (visualizador do CRM); outros sites continuam sem poder embutir o ERP.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

    # Documentos enviados pelos usuários (MEDIA_ROOT do Django, volume media_data
    # montado read-only). O Django NÃO serve /media com DEBUG=False, por isso o
    # download precisa sair daqui. Sem este bloco todo anexo retorna 404.
    #
    # Anexos são conteúdo enviado por usuários servido no MESMO domínio do ERP: se um
    # .html/.svg/.xml fosse renderizado aqui, o script dele leria o JWT do localStorage de
    # quem abriu (XSS armazenado). Por isso só PDF e imagens abrem no navegador; todo o
    # resto vai como download (Content-Disposition: attachment) e nunca é renderizado.
    # O backend já recusa essas extensões no upload (DocumentoSerializer.validate_arquivo)
    # — isto aqui cobre arquivos antigos que já estejam no volume.
    #
    # Login + permissão: antes de servir qualquer arquivo, pergunta ao Django
    # (auth_request -> /comercial/media-auth/) se quem pediu pode baixá-lo. Quem pediu é
    # identificado pelo cookie HttpOnly `erp_media`, gravado no login/refresh do JWT
    # (ver BackEnd/ComercialApp/media_auth.py). 401 sem sessão, 403 sem acesso.
    location /media/ {
        auth_request /_media_auth;
        alias /usr/share/nginx/media/;

        # Definir add_header aqui cancela a herança dos headers do server{}, então
        # o nosniff é repetido de propósito (e em cada location aninhada abaixo).
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "private, no-store" always;
        # Valores vêm dos `map` no topo do arquivo — vazios para PDF/imagem, e o nginx não
        # emite um add_header com valor vazio.
        add_header Content-Disposition $media_disposition always;
        add_header Content-Security-Policy $media_csp always;

        # Sem fallback para o index.html: arquivo inexistente deve ser 404 de verdade.
        try_files $uri =404;
    }

    # Sub-requisição interna do auth_request acima (não acessível de fora). O upstream vai
    # numa variável + resolver do Docker para o nginx não falhar ao subir se o backend
    # ainda não estiver de pé (com host fixo no proxy_pass ele resolve só na partida).
    location = /_media_auth {
        internal;
        resolver 127.0.0.11 valid=30s;
        set $media_auth_upstream http://backend:8000/comercial/media-auth/;
        proxy_pass $media_auth_upstream;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
