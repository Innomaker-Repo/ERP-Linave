server {
    listen 80;
    server_name localhost;

    # Oculta a versão do Nginx
    server_tokens off;

    # Cabeçalhos de Segurança Pesados
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;

    # Documentos enviados pelos usuários (MEDIA_ROOT do Django, volume media_data
    # montado read-only). O Django NÃO serve /media com DEBUG=False, por isso o
    # download precisa sair daqui. Sem este bloco todo anexo retorna 404.
    location /media/ {
        alias /usr/share/nginx/media/;

        # Definir add_header aqui cancela a herança dos headers do server{}, então
        # o nosniff é repetido de propósito.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "private, no-store" always;

        # Sem fallback para o index.html: arquivo inexistente deve ser 404 de verdade.
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
